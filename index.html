<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>CCB - VRB</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#eef4f1;color:#1d2b26;min-height:100vh}
  header{background:#1f6f5c;color:#fff;padding:22px 16px 26px;text-align:center}
  .logo{display:inline-block;margin-bottom:14px}
  .logo img{display:block;width:210px;height:auto}
  header h1{margin:0;font-size:24px}
  header p{margin:4px 0 0;font-size:14px;opacity:.85}
  main{max-width:480px;margin:0 auto;padding:18px 16px 30px}
  .btn{display:flex;align-items:center;gap:14px;width:100%;padding:18px 16px;margin-bottom:12px;border-radius:16px;border:1px solid #d5e2dc;background:#fff;color:#1d2b26;text-decoration:none;font-size:19px;font-weight:700;cursor:pointer;text-align:left;font-family:inherit;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .btn:active{transform:scale(.98)}
  .btn .ic{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
  .btn small{display:block;font-size:13px;font-weight:500;color:#5f716a;margin-top:2px}
  .ens .ic{background:#e3eefa}
  .rec .ic{background:#f3e8fb}
  .wpp{background:#25a244;color:#fff;border-color:#25a244}
  .wpp small{color:#e3f6e8}
  .wpp .ic{background:rgba(255,255,255,.2)}
  .inst{background:#fff159;border-color:#e6d84a}
  .inst small{color:#5a5420}
  .inst .ic{background:rgba(0,0,0,.06)}
  .hidden{display:none}
  .modal{position:fixed;inset:0;background:rgba(15,30,25,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
  .modal.hidden{display:none}
  .box{background:#fff;border-radius:16px;max-width:380px;width:100%;padding:20px;font-size:16px;line-height:1.5}
  .box h3{margin:0 0 10px}
  .box ol{padding-left:20px;margin:0 0 14px}
  .box button{width:100%;padding:13px;border:0;border-radius:10px;background:#1f6f5c;color:#fff;font-size:16px;font-weight:700}
  footer{text-align:center;font-size:12px;color:#8a9a94;padding-bottom:20px}
</style>
</head>

<header>

</main>
<footer>Congregação Cristã no Brasil</footer>

const LINK_APP = location.origin + location.pathname.replace(/[^\/]*$/, '');

/* compartilhar: abre o WhatsApp com a mensagem e o link */
function compartilhar(){
  const msg = 'App CCB - VRB (Contagem do Ensaio Local e dos Recitativos RJM)\n' + LINK_APP + '\nAbra o link e toque em "Instalar APP".';
  location.href = 'https://wa.me/?text=' + encodeURIComponent(msg);
}

/* instalar: só aparece para quem abriu pelo navegador */
const instalado = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let pedido = null;
if(!instalado()) document.getElementById('btnInstalar').classList.remove('hidden');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedido = e; });
window.addEventListener('appinstalled', () => document.getElementById('btnInstalar').classList.add('hidden'));
async function instalar(){
  if(pedido){ pedido.prompt(); const r = await pedido.userChoice; pedido = null;
    if(r && r.outcome === 'accepted') document.getElementById('btnInstalar').classList.add('hidden'); return; }
  const iphone = /iphone|ipad|ipod/i.test(navigator.userAgent);
  document.getElementById('passos').innerHTML = iphone
    ? '<li>Toque no botão <b>Compartilhar</b> do Safari (quadrado com seta para cima).</li><li>Escolha <b>Adicionar à Tela de Início</b>.</li><li>Toque em <b>Adicionar</b>.</li>'
    : '<li>Toque nos <b>3 pontinhos ⋮</b> do navegador (canto de cima).</li><li>Escolha <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</li><li>Confirme em <b>Instalar</b>.</li>';
  document.getElementById('modal').classList.remove('hidden');
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
